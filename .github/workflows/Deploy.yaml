name: Build and Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 外部项目配置（按需修改）
  EXT_REPO: https://github.com/nulla2011/sysx-wordle
  EXT_REF: master
  EXT_DIR: external/wordle
  EXT_BUILD_OUTPUT: dist        # 外部项目构建产物目录
  PUBLIC_TARGET: public/wordle   # 拷贝到本项目的目标目录

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      # 1. 拉取本项目
      - name: Checkout current repo
        uses: actions/checkout@v4

      # 2. 拉取外部项目（私有仓库用 PAT）
      - name: Checkout external repo
        uses: actions/checkout@v4
        with:
          repository: nulla2011/sysx-wordle
          ref: master
          path: ${{ env.EXT_DIR }}
          # 如需拉取子模块：submodules: recursive

      # 3. 配置 Node + pnpm 缓存（两个 lockfile 一起缓存）
      - name: Setup Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ env.EXT_DIR }}/pnpm-lock.yaml

      - name: Build external project
        working-directory: ${{ env.EXT_DIR }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:subpath
        env:
          ANSWER_API: ${{ vars.WORDLE_API }}

      # 4. 拷贝产物到本项目 public
      - name: Copy external build output into public
        run: |
          mkdir -p ${{ env.PUBLIC_TARGET }}
          rm -rf ${{ env.PUBLIC_TARGET }}/*
          cp -r ${{ env.EXT_DIR }}/${{ env.EXT_BUILD_OUTPUT }}/. ${{ env.PUBLIC_TARGET }}/

      # 5. 构建本项目
      - name: Install & build current project
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 6. 部署到 Vercel
      - name: Deploy to Vercel (production)
        run: |
          npm i -g vercel@latest
          vercel deploy --prod ./dist --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}